name: Manual webOS Build and Release

on:
  workflow_dispatch:
    inputs:
      kodi_branch:
        description: "Kodi branch/ref to build"
        required: true
        default: "Omega"
      toolchain_url:
        description: "Download URL for arm-webos-linux-gnueabi SDK buildroot tar.gz"
        required: true
        default: "https://github.com/openlgtv/buildroot-nc4/releases/download/webos-a38c582/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz"
      release_tag:
        description: "Release tag name (leave empty for auto-generated tag)"
        required: false
        default: ""
      validate_only:
        description: "Run a faster validation flow (depends + native cmake smoke test only, skip Kodi/ipk/release)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build-webos:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ github.workspace }}/build
      DEPS_PREFIX: ${{ github.workspace }}/kodi-deps
      TOOLCHAIN_DIR: ${{ github.workspace }}/kodi-dev
      TOOLCHAIN_NAME: arm-webos-linux-gnueabi_sdk-buildroot
      APP_ID: org.xbmc.kodi
      TARBALLS_DIR: ${{ github.workspace }}/.cache/xbmc-tarballs
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kodi_branch }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint autotools-dev bison build-essential cmake curl flex gawk gettext \
            ccache cpp default-jre-headless g++ gcc git gperf jq libtool lsb-release meson nasm \
            ninja-build patch pkg-config python3 python3-dev python3-minimal swig unzip uuid-dev zip zlib1g-dev

      - name: Verify toolchain prerequisites
        run: |
          set -euo pipefail
          gcc --version | head -n1
          g++ --version | head -n1
          cmake --version | head -n1
          meson --version
          ninja --version
          python3 --version


      - name: Restore depends tarballs cache
        if: ${{ !inputs.validate_only }}
        uses: actions/cache@v4
        with:
          path: ${{ env.TARBALLS_DIR }}
          key: webos-tarballs-${{ inputs.kodi_branch }}-${{ hashFiles('tools/depends/**') }}
          restore-keys: |
            webos-tarballs-${{ inputs.kodi_branch }}-

      - name: Restore ccache
        if: ${{ !inputs.validate_only }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: webos-ccache-${{ inputs.kodi_branch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'xbmc/**', 'tools/depends/**') }}
          restore-keys: |
            webos-ccache-${{ inputs.kodi_branch }}-

      - name: Download webOS toolchain
        if: ${{ !inputs.validate_only }}
        run: |
          mkdir -p "$TOOLCHAIN_DIR"
          curl -fL "${{ inputs.toolchain_url }}" -o "$TOOLCHAIN_DIR/toolchain.tar.gz"
          tar -xzf "$TOOLCHAIN_DIR/toolchain.tar.gz" -C "$TOOLCHAIN_DIR"

      - name: Build depends
        if: ${{ !inputs.validate_only }}
        run: |
          set -euo pipefail
          mkdir -p "$TARBALLS_DIR" "$CCACHE_DIR"
          ccache --zero-stats || true
          DEPENDS_LOG="$RUNNER_TEMP/depends-build.log"
          exec > >(tee -a "$DEPENDS_LOG") 2>&1

          configure_depends() {
            ./configure \
              --prefix="$DEPS_PREFIX" \
              --host=arm-webos-linux-gnueabi \
              --with-toolchain="$TOOLCHAIN_DIR/$TOOLCHAIN_NAME" \
              --with-tarballs="$TARBALLS_DIR" \
              --disable-debug
          }

          cd tools/depends
          git clean -f -xfd .
          ./bootstrap
          configure_depends

          if ! make -j"$(nproc)"; then
            echo "Parallel depends build failed. Cleaning native python3/cmake state and retrying serially..."
            make -C native/python3 distclean || true
            make -C native/cmake distclean || true
            rm -rf native/cmake/x86_64-linux-native || true
            make -j1
          fi

          if ! test -x native/cmake/x86_64-linux-native/bin/cmake; then
            echo "Native cmake was not generated correctly. Rebuilding depends from clean state..."
            make distclean || true
            ./bootstrap
            configure_depends
            make -j1
          fi

      - name: Collect depends diagnostics on failure
        if: ${{ !inputs.validate_only && failure() }}
        run: |
          set -euo pipefail
          DIAG_DIR="$RUNNER_TEMP/depends-diagnostics"
          mkdir -p "$DIAG_DIR"
          {
            echo "== pwd =="
            pwd
            echo "== tools/depends/native/cmake (maxdepth 3) =="
            find tools/depends/native/cmake -maxdepth 3 -mindepth 1 -print 2>/dev/null || true
            echo "== tools/depends/native/python3 (maxdepth 3) =="
            find tools/depends/native/python3 -maxdepth 3 -mindepth 1 -print 2>/dev/null || true
          } > "$DIAG_DIR/filesystem-snapshot.txt"

          if [ -f "$RUNNER_TEMP/depends-build.log" ]; then
            cp "$RUNNER_TEMP/depends-build.log" "$DIAG_DIR/depends-build.log"
          fi

      - name: Upload depends diagnostics artifact
        if: ${{ !inputs.validate_only && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: depends-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/depends-build.log
            ${{ runner.temp }}/depends-diagnostics/filesystem-snapshot.txt
          if-no-files-found: ignore

      - name: Stop after package validation (fast mode)
        if: ${{ inputs.validate_only }}
        run: |
          echo "validate_only=true -> Ran dependency package/prerequisite checks only; skipped cache, toolchain download, depends and all build/release steps."

      - name: Show ccache statistics
        if: ${{ !inputs.validate_only && always() }}
        run: ccache --show-stats || true

      - name: Generate CMake build system
        if: ${{ !inputs.validate_only }}
        run: |
          make -C tools/depends/target/cmakebuildsys \
            BUILD_DIR="$BUILD_DIR" \
            CMAKE_EXTRA_ARGUMENTS="-DCORE_PLATFORM_NAME=webos"

      - name: Build all binary addons
        if: ${{ !inputs.validate_only }}
        run: |
          make -j"$(nproc)" -C tools/depends/target/binary-addons \
            PREFIX="$BUILD_DIR/tools/webOS/packaging"

      - name: Build Kodi and IPK
        if: ${{ !inputs.validate_only }}
        run: |
          make -C "$BUILD_DIR" -j"$(nproc)"
          make -C "$BUILD_DIR" ipk

      - name: Collect artifacts and metadata
        if: ${{ !inputs.validate_only }}
        id: meta
        run: |
          set -euo pipefail
          IPK_PATH="$(find "$BUILD_DIR" -maxdepth 2 -type f -name '*.ipk' | head -n1)"
          if [ -z "$IPK_PATH" ]; then
            echo "No .ipk artifact produced" >&2
            exit 1
          fi

          IPK_FILE="$(basename "$IPK_PATH")"
          APP_VERSION="$(echo "$IPK_FILE" | sed -E 's/^org\.xbmc\.kodi[_-]([0-9][^_]*)_.*/\1/')"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" = "$IPK_FILE" ]; then
            APP_VERSION="${{ github.run_number }}"
          fi

          RELEASE_TAG="${{ inputs.release_tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="webos-${{ inputs.kodi_branch }}-${{ github.run_number }}"
          fi

          SHA256="$(sha256sum "$IPK_PATH" | awk '{print $1}')"
          IPK_SIZE="$(stat -c '%s' "$IPK_PATH")"
          BASE_RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          IPK_URL="$BASE_RELEASE_URL/$IPK_FILE"
          APP_JSON_PATH="$RUNNER_TEMP/app.json"

          jq -n \
            --arg app_id "$APP_ID" \
            --arg version "$APP_VERSION" \
            --arg branch "${{ inputs.kodi_branch }}" \
            --arg icon_uri "https://raw.githubusercontent.com/${{ github.repository }}/${{ inputs.kodi_branch }}/media/icon256x256.png" \
            --arg source_url "https://github.com/${{ github.repository }}" \
            --arg ipk_url "$IPK_URL" \
            --arg sha256 "$SHA256" \
            --argjson ipk_size "$IPK_SIZE" \
            '{
              paging: { page: 1, count: 1, maxPage: 1, itemsTotal: 1 },
              packages: [
                {
                  id: $app_id,
                  title: "Kodi",
                  iconUri: $icon_uri,
                  manifestUrl: ("/api/apps/" + $app_id + "/manifests/" + $version + ".json"),
                  manifest: {
                    id: $app_id,
                    title: "Kodi",
                    version: $version,
                    type: "native",
                    appDescription: null,
                    iconUri: $icon_uri,
                    sourceUrl: $source_url,
                    ipkUrl: $ipk_url,
                    ipkHash: { sha256: $sha256 },
                    ipkSize: $ipk_size,
                    installedSize: $ipk_size
                  },
                  pool: "main",
                  detailIconUri: $icon_uri,
                  requirements: {
                    webosRelease: ">=4.0",
                    deviceSoC: ["!k5lp"]
                  },
                  shortDescription: null,
                  fullDescriptionUrl: ("apps/" + $app_id + "/full_description.html")
                }
              ]
            }' > "$APP_JSON_PATH"

          echo "ipk_path=$IPK_PATH" >> "$GITHUB_OUTPUT"
          echo "ipk_file=$IPK_FILE" >> "$GITHUB_OUTPUT"
          echo "app_json_path=$APP_JSON_PATH" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload artifacts
        if: ${{ !inputs.validate_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: webOS build ${{ steps.meta.outputs.release_tag }}
          files: |
            ${{ steps.meta.outputs.ipk_path }}
            ${{ steps.meta.outputs.app_json_path }}
          generate_release_notes: true
